<!DOCTYPE html>
<html lang="en"> <!-- Root HTML element, with language set to English -->
<head>
  <meta charset="UTF-8" /> <!-- Sets character encoding to UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <!-- Ensures responsive scaling on mobile devices -->
  <title>Drainage Health Portal</title> <!-- Title shown on browser tab -->

  <style>
    /* === GLOBAL RESET STYLES === */
    * {
      box-sizing: border-box; /* Includes padding and border in element's total width/height */
    }

    body {
      font-family: Arial, sans-serif; /* Sets default font */
      margin: 0; /* Removes default margin */
      background: #f4f4f4; /* Light grey background */
    }

    /* === HEADER STYLES === */
    header {
      background: #0288d1; /* Blue background */
      color: white; /* White text */
      padding: 1rem; /* Space around content */
      text-align: center; /* Centered heading */
    }

    /* === NAVIGATION STYLES === */
    nav {
      background: #0277bd; /* Slightly darker blue */
      padding: 0.5rem; /* Padding inside nav */
      display: flex; /* Horizontal layout */
      justify-content: center; /* Center the links */
      gap: 1rem; /* Space between links */
    }

    nav a {
      color: white; /* Link text color */
      text-decoration: none; /* Removes underline */
      padding: 0.5rem 1rem; /* Padding around links */
    }

    nav a:hover {
      background: #01579b; /* Darker background on hover */
      border-radius: 5px; /* Rounded corners */
    }

    /* === CONTAINER === */
    .container {
      padding: 2rem; /* Padding inside the container */
      max-width: 800px; /* Max width of the content */
      margin: auto; /* Center align */
      background: white; /* White background */
      margin-top: 1rem; /* Space from top */
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem; /* Space between form elements */
    }

    button {
      padding: 10px;
      background: #0288d1; /* Button background color */
      color: white; /* Text color */
      border: none; /* No border */
      cursor: pointer; /* Pointer cursor on hover */
      width: 100%; /* Full width */
    }

    button:hover {
      background: #0277bd; /* Slightly darker on hover */
    }

    /* === COMPLAINT CARD STYLING === */
    .complaint-card {
      border: 1px solid #ccc;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 10px;
      background-color: #f9f9f9;
    }

    .complaint-card img {
      width: 100%;
      border-radius: 5px;
      margin-top: 0.5rem;
    }

    .story img {
      width: 100%;
      border-radius: 8px;
    }

    .error-msg {
      color: red;
      margin-top: -12px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    /* === FLEX LAYOUT FOR INNER CONTAINER === */
    .container-inner-section {
      display: flex;
      gap: 20px; /* Space between cards */
    }

    /* === LOGIN CARD STYLES === */
    .card {
      width: 250px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background: #fff;
      text-align: center;
      position: relative;
    }

    .card-header {
      padding: 20px;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    /* Different gradient backgrounds based on role */
    .citizen, .gvmc_portal, .sanitation_team {
      background: linear-gradient(135deg, #91268f, #651a74);
    }

    .card-body {
      padding: 15px;
      text-align: left;
      display: flex;
      justify-content: space-between;
    }

    .card-body label {
      display: block;
      color: red;
      margin-top: 10px;
      font-weight: bold;
    }

    .card-body input {
      width: 90%;
      padding: 6px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Buttons for login and register */
    .login-btn, .register-btn {
      padding: 6px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to bottom, #999, #555);
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      margin-bottom: 5px;
    }

    /* Icon inside card */
    .icon {
      width: 60px;
      height: 60px;
    }

    .icon.gvmc_portal {
      left: 10px;
    }

    .icon.sanitation_team {
      left: 10px;
    }

    /* Anchor tag inside button */
    .register-btn a,
    .login-btn a {
      color: #fff;
      text-decoration: none;
    }

    /* Highlight for current active link */
    .active {
      background-color: grey;
    }
  </style>
</head>
<body>
  <!-- Header section -->
  <header>
    <h1>Drainage System Revitalization Portal</h1>
  </header>

  <!-- Navigation bar -->
  <nav>
    <a href="home.html" class="active">Home</a>
    <a href="stories.html">Stories</a>
    <a href="policy.html">Policy</a>
    <a href="contact.html">Contact</a>
    <a href="sanitationteam.php">Sanitation</a>
  </nav>

  <!-- Main container section -->
  <div class="container">
    <div class="container-inner-section">

      <!-- Citizen Login Card -->
      <div class="card">
        <div class="card-header citizen">Citizen</div>
        <div class="card-body">
          <div>
            <img src="https://img.icons8.com/office/80/000000/administrator-male.png" class="icon" alt="Citizen Icon"/>
          </div>
          <div style="text-align: center;">
            <button class="login-btn"><a href="login.html?person=citizen">Login</a></button>
            <button class="register-btn"><a href="registercitizen.html">Register</a></button>
          </div>
        </div>
      </div>

      <!-- GVMC Portal Login Card -->
      <div class="card">
        <div class="card-header gvmc_portal">GVMC Portal</div>
        <div class="card-body">
          <div>
            <img src="https://img.icons8.com/office/80/000000/administrator-male.png" class="icon" alt="GVMC Portal Icon"/>
          </div>
          <div style="text-align: center;">
            <button class="login-btn"><a href="login.html?person=gvmcemp">Login</a></button>
            <button class="register-btn"><a href="registergvmc.html">Register</a></button>
          </div>
        </div>
      </div>

      <!-- Sanitation Team Login Card -->
      <div class="card">
        <div class="card-header sanitation_team">Sanitation Team</div>
        <div class="card-body">
          <div>
            <img src="https://img.icons8.com/office/80/000000/administrator-male.png" class="icon" alt="Sanitation Team Icon"/>
          </div>
          <div style="text-align: center;">
            <button class="login-btn"><a href="login.html?person=sanitationemp">Login</a></button>
            <button class="register-btn"><a href="registersanitation.html">Register</a></button>
          </div>
        </div>
      </div>

    </div> <!-- End of inner-section -->
  </div> <!-- End of container -->

  <!-- JavaScript function to redirect based on dropdown selection (currently not used) -->
  <script>
    function SubmitForm() {
      const role = document.getElementById("role").value; // Get selected role from dropdown

      if (role === "") {
        document.getElementById("role_error").textContent = "Please select a role."; // Show error
        return;
      } else {
        document.getElementById("role_error").textContent = ""; // Clear error
      }

      // Redirect to the respective registration page based on role
      if (role === "citizen") {
        window.location.href = "registercitizen.html";
      } else if (role === "gvmc") {
        window.location.href = "registergvmc.html";
      } else if (role === "sanitation") {
        window.location.href = "registergvmc.html"; // Probably meant to be "registersanitation.html"
      }
    }
  </script>

</body>
</html>
