<!DOCTYPE html> <!-- Defines the document as HTML5 -->
<html lang="en"> <!-- Sets the language of the page to English -->

<head>
  <meta charset="UTF-8" /> <!-- Sets character encoding to UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- Makes page responsive on all devices -->
  <title>Register - MedLink</title> <!-- Title shown in browser tab -->
  <style>
    /* ===== Global Reset and Basic Styles ===== */
    * { box-sizing: border-box; } /* Includes padding and border in element width/height */
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; } /* Sets body font, removes margin, adds bg */

    /* ===== Header Styles ===== */
    header {
      background: #0288d1; /* Blue background */
      color: white; /* White text */
      padding: 1rem; /* Padding inside header */
      text-align: center; /* Center-aligns header text */
    }

    /* ===== Navigation Bar ===== */
    nav {
      background: #0277bd; /* Darker blue background */
      padding: 0.5rem;
      display: flex;
      justify-content: center;
      gap: 1rem; /* Space between nav links */
    }
    nav a {
      color: white; /* White text */
      text-decoration: none; /* Removes underline */
      padding: 0.5rem 1rem; /* Padding inside links */
    }
    nav a:hover {
      background: #01579b; /* Darker blue on hover */
      border-radius: 5px; /* Rounded corners on hover */
    }

    /* ===== Container (Main Box) ===== */
    .container {
      padding: 2rem; /* Padding inside container */
      max-width: 800px; /* Max width */
      margin: auto; /* Center horizontally */
      background: white; /* White background */
      margin-top: 1rem; /* Space above container */
    }

    .hidden { display: none; } /* Hides elements if needed */

    /* ===== Form Layout ===== */
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem; /* Gap between form elements */
    }

    /* ===== Input Fields ===== */
    input, select, textarea {
      padding: 10px;
      width: 100%; /* Full width */
    }

    /* ===== Submit Button ===== */
    button {
      padding: 10px;
      background: #0288d1; /* Button color */
      color: white;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #0277bd; /* Darker on hover */
    }

    /* ===== Card Styling ===== */
    .complaint-card {
      border: 1px solid #ccc;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 10px;
      background-color: #f9f9f9;
    }
    .complaint-card img {
      width: 100%;
      border-radius: 5px;
      margin-top: 0.5rem;
    }
    .story img {
      width: 100%;
      border-radius: 8px;
    }

    /* ===== Error Messages ===== */
    .error-msg {
      color: red;
      margin-top: -12px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    /* ===== Labels ===== */
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    /* ===== Specific Input Styling ===== */
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      margin-bottom: 18px;
      box-sizing: border-box;
    }

    /* ===== Input Focus Effect ===== */
    input:focus,
    select:focus {
      border-color: #2a7a3b; /* Green border on focus */
      outline: none;
    }

    a.active {
      background-color: grey; /* Active link style */
    }

  </style>
</head>

<body>
  <!-- ===== Page Header ===== -->
  <header>
    <h1>Drainage System Revitalization Portal</h1>
  </header>

  <!-- ===== Navigation Bar ===== -->
  <nav>
    <a href="home.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="policy.html">Policy</a>
    <a href="contact.html">Contact</a>
    <a href="sanitationteam.php">Sanitation</a>
  </nav>

  <!-- ===== Main Registration Form Container ===== -->
  <div class="container">

    <!-- Email Field -->
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="example@mail.com" />
    <span class="error-msg" id="email_error"></span>

    <!-- Area Field -->
    <label for="area">Area</label>
    <input type="text" id="area" name="area" placeholder="Enter your area" />
    <span class="error-msg" id="area_error"></span></br>

    <!-- Password Field -->
    <label for="area">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" /><br>
    <span class="error-msg" id="password_error"></span></br>

    <!-- Confirm Password Field -->
    <label for="area">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Enter your confirm password" /><br>
    <span class="error-msg" id="confirm_password_error"></span></br>

    <!-- Submit Button -->
    <button type="button" onclick="SubmitForm()">Register</button>
  </div>

  <!-- ===== jQuery Library ===== -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- ===== Custom JS Script for Form Handling ===== -->
  <script>
    // Runs once page is loaded
    $(document).ready(function () {
      // Clears email error when typing
      $('#email').on('input', function () {
        $('#email_error').text('');
      });

      // Clears area error when typing
      $('#area').on('input', function () {
        $('#area_error').text('');
      });

      // Clears password error
      $('#password').on('input', function () {
        $('#password_error').text('');
      });

      // Clears confirm password error
      $('#confirm_password').on('input', function () {
        $('#confirm_password_error').text('');
      });
    });

    // ===== Form Validation & Submission =====
    function SubmitForm() {
      let email = $('#email').val();
      let area = $('#area').val();
      let password = $('#password').val();
      let confirm_password = $('#confirm_password').val();
      let valid = true;

      // Email validation
      if (email === '') {
        $('#email_error').text(' Fill the field');
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        $('#email_error').text(' Enter a valid email address');
        valid = false;
      } else {
        $('#email_error').text('');
      }

      // Area validation
      if (area === '') {
        $('#area_error').text(' Fill the field');
        valid = false;
      } else {
        $('#area_error').text('');
      }

      // Password validation
      if (password === '') {
        $('#password_error').text('Fill the field');
        valid = false;
      } else {
        $('#password_error').text('');
      }

      // Confirm password check
      if (confirm_password === '') {
        $('#confirm_password_error').text('Fill the field');
        valid = false;
      } else {
        if (password != confirm_password) {
          $('#confirm_password_error').text('Fill the password correctly');
          valid = false;
        } else {
          $('#confirm_password_error').text('');
        }
      }

      // If all fields are valid, send data via AJAX
      if (valid) {
        jQuery.ajax({
          url: "http://localhost/csp/csp/registergvmc.php", // backend PHP URL
          type: "post",
          data: {
            email: email,
            password: password,
            area: area,
          },
          success: function (response) {
            console.log(response);
            if (response == "success") {
              window.location.href = 'status.php'; // redirect on success
            } else if (response == "fail") {
              alert(' Your email address is already registered');
              location.reload();
            }
          },
          error: function (jqXHR, textStatus, errorThrown) {
            console.log(textStatus, errorThrown);
          }
        });
      }
    }
  </script>
</body>
</html>
