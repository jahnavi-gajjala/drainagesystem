<!DOCTYPE html>
<html lang="en"> <!-- Document language is English -->
  <head>
    <meta charset="UTF-8" /> <!-- Sets character encoding to UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- Makes site responsive on all devices -->
    <title>Register - MedLink</title> <!-- Page title shown in browser tab -->

    <style>
      /* ====== Global Reset and Basic Styling ====== */
      * { box-sizing: border-box; } /* Includes padding & border in element's total size */
      body {
        font-family: Arial, sans-serif; /* Font style */
        margin: 0; /* Remove default browser margin */
        background: #f4f4f4; /* Light gray background */
      }

      header {
        background: #0288d1; /* Blue header background */
        color: white; /* White text */
        padding: 1rem; /* Inner spacing */
        text-align: center; /* Center the text */
      }

      nav {
        background: #0277bd; /* Nav bar background */
        padding: 0.5rem;
        display: flex; /* Flexbox layout */
        justify-content: center; /* Center nav items */
        gap: 1rem; /* Spacing between links */
      }

      nav a {
        color: white;
        text-decoration: none;
        padding: 0.5rem 1rem;
      }

      nav a:hover {
        background: #01579b; /* Darker blue on hover */
        border-radius: 5px;
      }

      .container {
        padding: 2rem;
        max-width: 800px;
        margin: auto; /* Center the container */
        background: white;
        margin-top: 1rem;
      }

      .hidden { display: none; } /* Utility class to hide elements */

      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      input, select, textarea {
        padding: 10px;
        width: 100%;
      }

      button {
        padding: 10px;
        background: #0288d1;
        color: white;
        border: none;
        cursor: pointer;
        width: 100%;
      }

      button:hover {
        background: #0277bd;
      }

      /* ====== Card and Image Styling (used in other parts) ====== */
      .complaint-card {
        border: 1px solid #ccc;
        padding: 1rem;
        margin-bottom: 1.5rem;
        border-radius: 10px;
        background-color: #f9f9f9;
      }

      .complaint-card img {
        width: 100%;
        border-radius: 5px;
        margin-top: 0.5rem;
      }

      .story img {
        width: 100%;
        border-radius: 8px;
      }

      /* ====== Error Message Styling ====== */
      .error-msg {
        color: red;
        margin-top: -12px;
        margin-bottom: 10px;
        font-size: 14px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #333;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      select {
        width: 100%;
        padding: 10px 12px;
        font-size: 16px;
        margin-bottom: 18px;
        box-sizing: border-box;
      }

      input:focus,
      select:focus {
        border-color: #2a7a3b;
        outline: none;
      }

      a.active {
        background-color: grey;
      }
    </style>
  </head>

  <body>
    <!-- ====== Header Section ====== -->
    <header>
      <h1>Drainage System Revitalization Portal</h1>
    </header>

    <!-- ====== Navigation Links ====== -->
    <nav>
      <a href="home.html">Home</a>
      <a href="stories.html">Stories</a>
      <a href="policy.html">Policy</a>
      <a href="contact.html">Contact</a>
      <a href="sanitationteam.php">Sanitation</a>
    </nav>

    <!-- ====== Registration Form Container ====== -->
    <div class="container">
      <!-- User input fields with validation placeholders and error messages -->
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" />
      <span class="error-msg" id="name_error"></span>

      <label for="email">Email Address / Username</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" />
      <span class="error-msg" id="email_error"></span>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="9876543210" maxlength="10" />
      <span class="error-msg" id="phone_error"></span>

      <label for="area">Area</label>
      <input type="text" id="area" name="area" placeholder="Enter your area" />
      <span class="error-msg" id="area_error"></span></br>

      <label for="area">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" /><br>
      <span class="error-msg" id="password_error"></span></br>

      <label for="area">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Enter your confirm password" /><br>
      <span class="error-msg" id="confirm_password_error"></span></br>

      <!-- Submit Button triggers SubmitForm() -->
      <button type="button" onclick="SubmitForm()">Register</button>
    </div>

    <!-- ====== jQuery Library ====== -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
      // On document ready
      $(document).ready(function () {

        // Clear individual error messages on input
        $('#name').on('input', function () {
          $('#name_error').text('');
        });

        $('#email').on('input', function () {
          $('#email_error').text('');
        });

        $('#phone').on('input', function () {
          $('#phone_error').text('');
        });

        $('#area').on('input', function () {
          $('#area_error').text('');
        });

        $('#password').on('input', function () {
          $('#password_error').text('');
        });

        $('#confirm_password').on('input', function () {
          $('#confirm_password_error').text('');
        });

      });

      // ====== Main Form Validation and AJAX Submission ======
      function SubmitForm() {
        // Get input values
        let name = $('#name').val();
        let email = $('#email').val();
        let phone = $('#phone').val();
        let area = $('#area').val();
        let password = $('#password').val();
        let confirm_password = $('#confirm_password').val();

        let valid = true;

        // Name Validation
        if (name === '') {
          $('#name_error').text(' Fill the field');
          valid = false;
        }

        // Email Validation
        if (email === '') {
          $('#email_error').text(' Fill the field');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          $('#email_error').text(' Enter a valid email address');
          valid = false;
        }

        // Phone Validation
        if (phone === '') {
          $('#phone_error').text(' Fill the field');
          valid = false;
        } else if (!/^[6-9]\d{9}$/.test(phone)) {
          $('#phone_error').text(' Enter a valid 10-digit phone number');
          valid = false;
        }

        // Area Validation
        if (area === '') {
          $('#area_error').text(' Fill the field');
          valid = false;
        }

        // Password Validation
        if (password === '') {
          $('#password_error').text('Fill the field');
          valid = false;
        }

        if (confirm_password === '') {
          $('#confirm_password_error').text('Fill the field');
          valid = false;
        } else if (password != confirm_password) {
          $('#confirm_password_error').text('Fill the password correctly');
          valid = false;
        }

        // ====== Submit Data to PHP if all fields are valid ======
        if (valid) {
          jQuery.ajax({
            url: "http://localhost/csp/csp/registercitizen.php", // Server-side PHP handler
            type: "post",
            data: {
              email: email,
              password: password,
              area: area,
              phone: phone,
              name: name,
            },
            success: function (response) {
              console.log(response);
              if (response == "success") {
                window.location.href = 'report.html'; // Redirect to report page
              } else if (response == "fail") {
                alert(' Your email address is already registered');
                location.reload(); // Reload page
              }
            },
            error: function (jqXHR, textStatus, errorThrown) {
              console.log(textStatus, errorThrown); // Log errors
            }
          });
        }
      }
    </script>
  </body>
</html>
